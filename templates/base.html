<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>EcoCart AI — {% block title %}Dashboard{% endblock %}</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 <style>
 :root {
 --eco-green: #2d6a4f;
 --eco-light: #b7e4c7;
 --eco-dark: #1b4332;
 --eco-accent: #52b788;
 }
 body { background: #f0f4f0; font-family: 'Segoe UI', sans-serif; }
 .navbar { background: var(--eco-dark) !important; }
 .navbar-brand { font-weight: 700; font-size: 1.4rem; color: var(--eco-light) !important; }
 .nav-link { color: #ccc !important; }
 .nav-link.active, .nav-link:hover { color: var(--eco-light) !important; }
 .sidebar { background: var(--eco-green); min-height: calc(100vh - 56px); padding: 1.5rem 0; }
 .sidebar a { color: var(--eco-light); display: block; padding: .6rem 1.5rem; text-decoration: none; border-radius: 0 25px 25px 0; margin-right: 1rem; }
 .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,.15); color: #fff; }
 .main-content { padding: 2rem; }
 .card { border: none; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
 .card-header { background: var(--eco-green); color: #fff; border-radius: 12px 12px 0 0 !important; }
 .btn-eco { background: var(--eco-green); color: #fff; border: none; }
 .btn-eco:hover { background: var(--eco-dark); color: #fff; }
 .badge-eco { background: var(--eco-accent); }
 .section-title { color: var(--eco-dark); font-weight: 700; border-left: 4px solid var(--eco-accent); padding-left: .75rem; }
 pre { background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 8px; font-size: .85rem; overflow-x: auto; }
 .algo-badge { font-size: .75rem; padding: .3rem .6rem; border-radius: 20px; font-weight: 600; }
 .spinner-border-eco { color: var(--eco-green); }
 </style>
 {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-dark px-3">
 <a class="navbar-brand" href="/"> EcoCart</a>
</nav>

<div class="container-fluid">
 <div class="row">
 <!-- Sidebar -->
 <div class="col-md-2 sidebar d-none d-md-block">
 <div class="text-center mb-3">
 <small class="text-light opacity-75 text-uppercase fw-bold">Navigation</small>
 </div>
 <a href="/" class="{% block nav_home %}{% endblock %}"> Dashboard</a>
 <a href="/route/" class="{% block nav_route %}{% endblock %}"> Route Optimizer</a>
 <a href="/inventory/" class="{% block nav_inv %}{% endblock %}"> Inventory Forecast</a>
 <a href="/segment/" class="{% block nav_seg %}{% endblock %}"> Customer Segments</a>
 <hr class="border-light opacity-25 mx-3">
 <div class="px-3 mt-2">

 </div>
 </div>

 <!-- Main -->
 <div class="col-md-10 main-content">
 {% block content %}{% endblock %}
 </div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
